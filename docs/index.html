<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNIST in a QR code</title>
<style>
  :root { --bg: #0d0f11; --ink: #e9edf0; --dim: #6b757c; --live: #4ec9a5 }
  * { box-sizing: border-box }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .col { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 22px }

  #stage { width: 100%; height: 400px; border: 0; display: block }

  /* Ten scores, one row each. The digits label themselves. */
  #bars { display: grid; grid-template-columns: 12px 1fr; gap: 4px 9px; align-items: center }
  #bars b { font: 500 11px ui-monospace, monospace; color: var(--dim); text-align: right }
  #bars div { height: 7px; background: #1b1f22; border-radius: 4px; overflow: hidden }
  #bars i { display: block; height: 100%; background: #333a3f; border-radius: 4px; transition: width .15s }

  /* The kernels, as they are. */
  #filters { margin-top: 6px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px }
  #filters canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 2px }

  footer { color: var(--dim); font-size: 12.5px; text-align: center }
  a { color: var(--dim) }
  #fallback { color: var(--dim); text-align: center; padding: 40px 0 }
</style>

<div class="col">
  <div id="fallback">Scan the code, or <a href="./demo.html">open the demo</a>.</div>

  <div id="app" hidden>
    <iframe id="stage" title="digit classifier"></iframe>
    <div id="bars"></div>
    <div id="filters"></div>
    <footer>
      627 B of weights, one bit each &middot; 96.37% on 10,000 digits &middot;
      all of it in the URL &middot;
      <a href="https://github.com/123Satyajeet123/mnist-qr">source</a>
    </footer>
  </div>
</div>

<script>
  // The model and the classifier. Shared by the QR payload and by verify.mjs, so
// the demo and its test can never drift apart.
//
// This file is written to be read. It gets minified and mangled by terser at
// build time, so names here cost nothing in the final payload.

// Unpack the model from the bytes the QR code carries.
//
// Byte layout:
//   [0]          number of convolution filters
//   [1]          pooled grid size (the feature map is grid x grid after pooling)
//   [2 .. 14)    three float32 scales, one for each int8 array below
//   [14 .. )     int8 channel scale, int8 channel shift, int8 per-class bias
//   then         one bit per weight, most significant first:
//                first the convolution kernels, then the dense layer
function unpackModel(base64) {
  const raw = atob(base64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

  const header = new DataView(bytes.buffer);
  const filters = bytes[0];
  const grid = bytes[1];

  // Each int8 array shares a single float32 scale. Undo that here.
  function dequantise(offset, count, scale) {
    const out = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      out[i] = (bytes[offset + i] << 24 >> 24) * scale;   // sign-extend to int8
    }
    return out;
  }

  const channelScale = dequantise(14, filters, header.getFloat32(2, true));
  const channelShift = dequantise(14 + filters, filters, header.getFloat32(6, true));
  const classBias = dequantise(14 + 2 * filters, 10, header.getFloat32(10, true));

  // Every weight is one bit, meaning +1 or -1. That is the whole reason the
  // model fits: 627 bytes holds just over 5,000 of them.
  let bit = (14 + 2 * filters + 10) * 8;
  function readSigns(count) {
    const out = new Int8Array(count);
    for (let i = 0; i < count; i++, bit++) {
      out[i] = (bytes[bit >> 3] >> (7 - (bit & 7))) & 1 ? 1 : -1;
    }
    return out;
  }

  return {
    filters,
    grid,
    channelScale,
    channelShift,
    classBias,
    convWeights: readSigns(25 * filters),
    denseWeights: readSigns(grid * grid * filters * 10),
  };
}

// Score one image against all ten digits. `pixels` is a Float32Array of 784
// values in 0..1, row-major 28x28. Returns the ten logits; the caller picks the
// argmax. Returning scores rather than a single digit lets the page show how
// confident the network was, which is most of what makes it legible.
//
// The network is: 5x5 convolution -> BatchNorm -> ReLU -> max-pool -> dense.
function scoreDigits(pixels, model) {
  const { filters, grid, convWeights, denseWeights } = model;
  const poolSize = 24 / grid;

  // Convolution. No padding, so 28x28 becomes 24x24.
  const activations = new Float32Array(24 * 24 * filters);
  for (let y = 0; y < 24; y++) {
    for (let x = 0; x < 24; x++) {
      for (let f = 0; f < filters; f++) {
        let sum = 0;
        for (let tap = 0; tap < 25; tap++) {
          const pixel = (y + (tap / 5 | 0)) * 28 + x + tap % 5;
          sum += pixels[pixel] * convWeights[tap * filters + f];
        }
        // BatchNorm was folded into one scale and shift per channel at export,
        // so inference is a multiply, an add, and a ReLU.
        const value = model.channelScale[f] * sum + model.channelShift[f];
        activations[(y * 24 + x) * filters + f] = value > 0 ? value : 0;
      }
    }
  }

  // Max-pool and accumulate the dense layer in the same pass, so the pooled
  // feature map never has to be written out.
  const logits = Float32Array.from(model.classBias);
  for (let row = 0; row < grid; row++) {
    for (let col = 0; col < grid; col++) {
      for (let f = 0; f < filters; f++) {
        let peak = 0;
        for (let dy = 0; dy < poolSize; dy++) {
          for (let dx = 0; dx < poolSize; dx++) {
            const at = ((row * poolSize + dy) * 24 + col * poolSize + dx) * filters + f;
            if (activations[at] > peak) peak = activations[at];
          }
        }
        const base = ((row * grid + col) * filters + f) * 10;
        for (let digit = 0; digit < 10; digit++) {
          logits[digit] += peak * denseWeights[base + digit];
        }
      }
    }
  }

  return logits;
}


  main();

  async function main() {
    const fragment = location.hash.slice(1);
    if (!fragment) return;

    const payload = await inflate(fragment);
    fallback.hidden = true;
    app.hidden = false;

    const stage = document.getElementById("stage");
    stage.srcdoc = payload;

    // Read the weights out of the same bytes that are running, so this can
    // never drift from the model in the frame. The payload is minified and its
    // names are mangled, so find the blob by shape: it is the only long base64
    // literal in there.
    const model = unpackModel(payload.match(/"([A-Za-z0-9+/]{200,}={0,2})"/)[1]);
    drawFilters(model);
    drawBars(new Float32Array(10), -1);

    stage.addEventListener("load", () => watch(stage.contentWindow, model));
  }

  async function inflate(fragment) {
    const padded = fragment + "=".repeat((4 - fragment.length % 4) % 4);
    const binary = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).text();
  }

  // The payload owns the drawing surface. Watch its 28x28 input and score the
  // same pixels here, rather than asking the payload to report anything back.
  function watch(frame, model) {
    const seen = frame.document.getElementById("seen");
    frame.document.getElementById("pad").addEventListener("pointerup", () => {
      setTimeout(() => {
        const image = seen.getContext("2d").getImageData(0, 0, 28, 28).data;
        const pixels = new Float32Array(784);
        for (let i = 0; i < 784; i++) pixels[i] = image[i * 4 + 3] / 255;
        if (!pixels.some(value => value > 0)) return;
        const scores = scoreDigits(pixels, model);
        drawBars(scores, scores.indexOf(Math.max(...scores)));
      }, 0);
    });
  }

  function drawBars(scores, winner) {
    const low = Math.min(...scores);
    const span = Math.max(...scores) - low || 1;
    bars.innerHTML = "";
    scores.forEach((score, digit) => {
      const label = document.createElement("b");
      label.textContent = digit;
      const track = document.createElement("div");
      const fill = document.createElement("i");
      fill.style.width = winner < 0 ? "0%" : Math.max(2, ((score - low) / span) * 100) + "%";
      if (digit === winner) {
        label.style.color = "var(--live)";
        fill.style.background = "var(--live)";
      }
      track.appendChild(fill);
      bars.append(label, track);
    });
  }

  // One bit per weight: white for +1, dark for -1.
  function drawFilters(model) {
    filters.innerHTML = "";
    for (let f = 0; f < model.filters; f++) {
      const cell = document.createElement("canvas");
      cell.width = cell.height = 5;
      const context = cell.getContext("2d");
      const image = context.createImageData(5, 5);
      for (let tap = 0; tap < 25; tap++) {
        const level = model.convWeights[tap * model.filters + f] > 0 ? 226 : 32;
        image.data.set([level, level, level, 255], tap * 4);
      }
      context.putImageData(image, 0, 0);
      filters.appendChild(cell);
    }
  }
</script>
