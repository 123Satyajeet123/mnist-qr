<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNIST in a QR code</title>
<style>
  :root { --bg: #0d0f11; --ink: #e9edf0; --dim: #6b757c; --live: #4ec9a5 }
  * { box-sizing: border-box }
  body {
    margin: 0;
    padding: 16px 16px 44px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .col { width: 100%; max-width: 356px; display: flex; flex-direction: column; gap: 18px }

  #stage { width: 100%; border: 0; display: block; overflow: hidden }

  .step { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px }
  .step em {
    font: 500 10px/1 ui-monospace, monospace;
    letter-spacing: .1em;
    color: var(--live);
    font-style: normal;
  }
  .step span { font-size: 12px; color: var(--dim) }

  /* 24 activation maps, one per filter, live. */
  #maps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px }
  #maps canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 2px; background: #14181a }

  /* Ten scores as one row, not ten stacked bars. */
  #scores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; align-items: end; height: 62px }
  #scores div { display: flex; flex-direction: column; justify-content: flex-end; height: 100% }
  #scores i { display: block; background: #2d3438; border-radius: 2px 2px 0 0; transition: height .18s }
  #scores b { font: 500 10px/1.6 ui-monospace, monospace; color: var(--dim); text-align: center }

  footer { color: var(--dim); font-size: 12px; text-align: center }
  a { color: var(--dim) }
  #fallback { color: var(--dim); text-align: center; padding: 40px 0 }
</style>

<div class="col">
  <div id="fallback">Scan the code, or <a href="./demo.html">open the demo</a>.</div>

  <div id="app" hidden>
    <div>
      <div class="step"><em>DRAW</em><span>a digit here, with your finger</span></div>
      <iframe id="stage" title="digit classifier"></iframe>
    </div>

    <div>
      <div class="step"><em>CONV</em><span>24 filters see the 28&times;28</span></div>
      <div id="maps"></div>
    </div>

    <div>
      <div class="step"><em>DENSE</em><span>ten scores</span></div>
      <div id="scores"></div>
    </div>

    <footer>
      627 B of weights, one bit each &middot; 96.37% on 10,000 digits &middot;
      <a href="https://github.com/123Satyajeet123/mnist-qr">source</a>
    </footer>
  </div>
</div>

<script>
  // The model and the classifier. Spliced into the QR payload, the viewer and
// verify.mjs, so the three cannot drift.
//
// Names are long because terser mangles them at build time.

// Unpack the model from the bytes the QR code carries.
//
// Byte layout:
//   [0]          number of convolution filters
//   [1]          pooled grid size (the feature map is grid x grid after pooling)
//   [2 .. 14)    three float32 scales, one for each int8 array below
//   [14 .. )     int8 channel scale, int8 channel shift, int8 per-class bias
//   then         one bit per weight, most significant first:
//                first the convolution kernels, then the dense layer
function unpackModel(base64) {
  const raw = atob(base64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

  const header = new DataView(bytes.buffer);
  const filters = bytes[0];
  const grid = bytes[1];

  // Each int8 array shares a single float32 scale. Undo that here.
  function dequantise(offset, count, scale) {
    const out = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      out[i] = (bytes[offset + i] << 24 >> 24) * scale;   // sign-extend to int8
    }
    return out;
  }

  const channelScale = dequantise(14, filters, header.getFloat32(2, true));
  const channelShift = dequantise(14 + filters, filters, header.getFloat32(6, true));
  const classBias = dequantise(14 + 2 * filters, 10, header.getFloat32(10, true));

  // Every weight is one bit, meaning +1 or -1.
  let bit = (14 + 2 * filters + 10) * 8;
  function readSigns(count) {
    const out = new Int8Array(count);
    for (let i = 0; i < count; i++, bit++) {
      out[i] = (bytes[bit >> 3] >> (7 - (bit & 7))) & 1 ? 1 : -1;
    }
    return out;
  }

  return {
    filters,
    grid,
    channelScale,
    channelShift,
    classBias,
    convWeights: readSigns(25 * filters),
    denseWeights: readSigns(grid * grid * filters * 10),
  };
}

// Run the convolution over one 28x28 image and return the 24x24 activations,
// one plane per filter, interleaved. The viewer draws these; scoreDigits pools
// them. Kept separate so both read the same code.
function convolve(pixels, model) {
  const { filters, convWeights } = model;
  const activations = new Float32Array(24 * 24 * filters);

  for (let y = 0; y < 24; y++) {
    for (let x = 0; x < 24; x++) {
      for (let f = 0; f < filters; f++) {
        let sum = 0;
        for (let tap = 0; tap < 25; tap++) {
          const pixel = (y + (tap / 5 | 0)) * 28 + x + tap % 5;
          sum += pixels[pixel] * convWeights[tap * filters + f];
        }
        // BatchNorm was folded into one scale and shift per channel at export.
        const value = model.channelScale[f] * sum + model.channelShift[f];
        activations[(y * 24 + x) * filters + f] = value > 0 ? value : 0;
      }
    }
  }
  return activations;
}

// Score one image against all ten digits. `pixels` is a Float32Array of 784
// values in 0..1, row-major 28x28. The caller picks the argmax.
//
// 5x5 convolution -> BatchNorm -> ReLU -> max-pool -> dense.
function scoreDigits(pixels, model) {
  const { filters, grid, denseWeights } = model;
  const poolSize = 24 / grid;
  const activations = convolve(pixels, model);

  // Max-pool and accumulate the dense layer in one pass.
  const logits = Float32Array.from(model.classBias);
  for (let row = 0; row < grid; row++) {
    for (let col = 0; col < grid; col++) {
      for (let f = 0; f < filters; f++) {
        let peak = 0;
        for (let dy = 0; dy < poolSize; dy++) {
          for (let dx = 0; dx < poolSize; dx++) {
            const at = ((row * poolSize + dy) * 24 + col * poolSize + dx) * filters + f;
            if (activations[at] > peak) peak = activations[at];
          }
        }
        const base = ((row * grid + col) * filters + f) * 10;
        for (let digit = 0; digit < 10; digit++) {
          logits[digit] += peak * denseWeights[base + digit];
        }
      }
    }
  }

  return logits;
}


  const SIDE = 24;
  let cells = [];

  main();

  async function main() {
    const fragment = location.hash.slice(1);
    if (!fragment) return;

    const payload = await inflate(fragment);
    fallback.hidden = true;
    app.hidden = false;

    const stage = document.getElementById("stage");
    stage.srcdoc = payload;

    // Unpack the weights from the same bytes running in the frame. The payload
    // is mangled, so find the blob by shape: the only long base64 literal.
    const model = unpackModel(payload.match(/"([A-Za-z0-9+/]{200,}={0,2})"/)[1]);
    buildMaps(model.filters);
    buildScores();

    stage.addEventListener("load", () => {
      fit(stage);
      watch(stage.contentWindow, model);
    });
  }

  // Size the frame to its content. A fixed height gives the payload its own
  // scrollbar, which on a phone is a second scroll region inside the page.
  function fit(stage) {
    const body = stage.contentDocument.body;
    const resize = () => {
      stage.style.height = body.scrollHeight + "px";
    };
    resize();
    new ResizeObserver(resize).observe(body);
  }

  async function inflate(fragment) {
    const padded = fragment + "=".repeat((4 - fragment.length % 4) % 4);
    const binary = atob(padded.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).text();
  }

  // The payload owns the drawing surface. Read its 28x28 input and run the same
  // network here rather than asking the payload to report anything back.
  function watch(frame, model) {
    const seen = frame.document.getElementById("seen");
    frame.document.getElementById("pad").addEventListener("pointerup", () => {
      setTimeout(() => {
        const image = seen.getContext("2d").getImageData(0, 0, 28, 28).data;
        const pixels = new Float32Array(784);
        for (let i = 0; i < 784; i++) pixels[i] = image[i * 4 + 3] / 255;
        if (!pixels.some(value => value > 0)) return;
        drawMaps(convolve(pixels, model), model.filters);
        drawScores(scoreDigits(pixels, model));
      }, 0);
    });
  }

  function buildMaps(filters) {
    maps.innerHTML = "";
    cells = [];
    for (let f = 0; f < filters; f++) {
      const cell = document.createElement("canvas");
      cell.width = cell.height = SIDE;
      maps.appendChild(cell);
      cells.push(cell.getContext("2d"));
    }
  }

  // One plane per filter, interleaved. Scale each map to its own peak so a
  // quiet filter is still visible.
  function drawMaps(activations, filters) {
    for (let f = 0; f < filters; f++) {
      let peak = 0;
      for (let i = 0; i < SIDE * SIDE; i++) {
        const value = activations[i * filters + f];
        if (value > peak) peak = value;
      }
      const context = cells[f];
      const image = context.createImageData(SIDE, SIDE);
      for (let i = 0; i < SIDE * SIDE; i++) {
        const level = peak ? activations[i * filters + f] / peak : 0;
        image.data.set([20 + level * 58, 24 + level * 177, 26 + level * 139, 255], i * 4);
      }
      context.putImageData(image, 0, 0);
    }
  }

  function buildScores() {
    scores.innerHTML = "";
    for (let digit = 0; digit < 10; digit++) {
      const column = document.createElement("div");
      const bar = document.createElement("i");
      bar.style.height = "2px";
      const label = document.createElement("b");
      label.textContent = digit;
      column.append(bar, label);
      scores.appendChild(column);
    }
  }

  function drawScores(logits) {
    const low = Math.min(...logits);
    const span = Math.max(...logits) - low || 1;
    const winner = logits.indexOf(Math.max(...logits));
    [...scores.children].forEach((column, digit) => {
      const [bar, label] = column.children;
      bar.style.height = Math.max(2, ((logits[digit] - low) / span) * 46) + "px";
      bar.style.background = digit === winner ? "var(--live)" : "#2d3438";
      label.style.color = digit === winner ? "var(--live)" : "var(--dim)";
    });
  }
</script>
